name: Build
on:
  push:
    branches:
      - main

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.get_date.outputs.date }}
    steps:
      - name: Generate build date
        id: get_date
        run: echo "date=$(date +%s)" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build ${{ matrix.target }}${{ matrix.is_appimage && ' AppImage' || '' }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    container: almalinux:8
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard Linux (x86_64)
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            is_appimage: false
            cargo_flags: ""
            artifact: linux-x64
          # Standard Linux (aarch64)
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            is_appimage: false
            cargo_flags: ""
            artifact: linux-aarch64
          # AppImage Linux (x86_64)
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            is_appimage: true
            appimage_arch: x86_64
            cargo_flags: "--features rustls"
            artifact: linux-x64-appimage
          # AppImage Linux (aarch64)
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            is_appimage: true
            appimage_arch: aarch64
            cargo_flags: "--features rustls"
            artifact: linux-aarch64-appimage
    env:
      CI_BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies
        run: dnf install -y gcc gcc-c++ make openssl-devel libcurl-devel pkgconf-pkg-config git file llvm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}
      - name: Build
        run: |
          cargo build --release ${{ matrix.cargo_flags }} --target ${{ matrix.target }}
          # Compress file while maintaining debuginfo
          llvm-dwarfutil target/${{ matrix.target }}/release/tack target/${{ matrix.target }}/release/tack-gc
          objcopy --compress-debug-sections=zlib target/${{ matrix.target }}/release/tack-gc target/${{ matrix.target }}/release/tack-zlib
          mv target/${{ matrix.target }}/release/tack-zlib target/${{ matrix.target }}/release/tack

      - name: Upload binary artifact
        if: matrix.is_appimage == false
        uses: actions/upload-artifact@v7
        with:
          name: tack-${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/tack

      - name: Build AppImage
        if: matrix.is_appimage == true
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          curl -LO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.appimage_arch }}.AppImage
          chmod +x linuxdeploy-${{ matrix.appimage_arch }}.AppImage

          # Create mandatory AppImage metadata
          cat > tack.desktop <<EOF
          [Desktop Entry]
          Name=tack
          Exec=tack
          Icon=tack
          Type=Application
          Categories=Utility;
          EOF
          echo '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="50"/></svg>' > tack.svg

          # Package the binary and copy shared libraries into the AppDir
          NO_STRIP=1 ./linuxdeploy-${{ matrix.appimage_arch }}.AppImage \
            --appdir AppDir \
            --executable target/${{ matrix.target }}/release/tack \
            --desktop-file tack.desktop \
            --icon-file tack.svg \
            --output appimage

          mv tack-${{ matrix.appimage_arch }}.AppImage tack.AppImage

      - name: Upload AppImage artifact
        if: matrix.is_appimage == true
        uses: actions/upload-artifact@v7
        with:
          name: tack-${{ matrix.artifact }}
          path: tack.AppImage

  build-native:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (x86_64)
          - os: macos-latest
            target: x86_64-apple-darwin
            extension: ""
            artifact: macos-x64
          # macOS (aarch64)
          - os: macos-latest
            target: aarch64-apple-darwin
            extension: ""
            artifact: macos-aarch64
          # Windows (x86_64)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: ".exe"
            artifact: windows-x64
          # Windows (aarch64)
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            extension: ".exe"
            artifact: windows-aarch64
    env:
      CI_BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: tack-${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/tack${{ matrix.extension }}
